<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện hình ảnh</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Thư viện hình ảnh</h1>
        <p>Bộ sưu tập hình ảnh đẹp &copy; 2026 &trade; - Website Demo</p>
    </header>

    <div class="container">
        <button onclick="toggleGallery()">Ẩn/Hiện thư viện</button>

        <div class="gallery" id="gallery">
            <div class="item">
                <img src="https://picsum.photos/id/1015/400/300" alt="Hình ảnh thiên nhiên">
                <div class="caption">Thiên nhiên xanh mát</div>
            </div>

            <div class="item">
                <img src="https://picsum.photos/id/1016/400/300" alt="Hình ảnh núi rừng">
                <div class="caption">Núi rừng hùng vĩ</div>
            </div>

            <div class="item">
                <img src="https://picsum.photos/id/1025/400/300" alt="Hình ảnh động vật">
                <div class="caption">Thế giới động vật</div>
            </div>

            <div class="item">
                <img src="https://picsum.photos/id/1035/400/300" alt="Hình ảnh biển">
                <div class="caption">Biển xanh yên bình</div>
            </div>

            <div class="item">
                <img src="https://picsum.photos/id/1043/400/300" alt="Hình ảnh thành phố">
                <div class="caption">Thành phố hiện đại</div>
            </div>

            <div class="item">
                <img src="https://picsum.photos/id/1050/400/300" alt="Hình ảnh con đường">
                <div class="caption">Con đường phía trước</div>
            </div>
        </div>
    </div>

    <footer>
        <p>Thiết kế bởi Sinh viên Web Design &reg;</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
