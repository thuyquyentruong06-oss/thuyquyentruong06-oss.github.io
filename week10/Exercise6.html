<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookstore Navigation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        
        nav {
            margin-top: 20px;
        }

        nav ul {
            list-style-type: none;
            padding: 0;
            display: flex;
            align-items: center;
        }

        nav li {
            display: inline;
        }

        /* Add bullets between navigation items */
        nav li:not(:last-child)::after {
            content: " \2022 "; 
            margin: 0 10px;
            color: #555;
        }

        nav a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
            color: #007bff;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <button onclick="toggleMenu()">Toggle Menu</button>
    
    <nav id="navMenu">
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Books &copy;</a></li>
            <li><a href="#">Authors &trade;</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <script>
        function toggleMenu() {
            var menu = document.getElementById("navMenu");
            menu.classList.toggle("hidden");
        }
    </script>
</body>
</html>
