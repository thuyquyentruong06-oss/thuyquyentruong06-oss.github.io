<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Parts Price List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Computer Parts Price List &copy; 2026</h1>
        <p>Official Computer Store &trade;</p>

        <table id="partsTable">
            <thead>
                <tr>
                    <th>No.</th>
                    <th>Computer Part</th>
                    <th>Description</th>
                    <th>Price</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>1</td>
                    <td>CPU</td>
                    <td>&bull; Intel Core i5 Processor</td>
                    <td>$180</td>
                </tr>

                <tr>
                    <td>2</td>
                    <td>RAM</td>
                    <td>&bull; 16GB DDR4 Memory</td>
                    <td>$60</td>
                </tr>

                <tr>
                    <td>3</td>
                    <td>SSD</td>
                    <td>&bull; 512GB Solid State Drive</td>
                    <td>$75</td>
                </tr>

                <tr>
                    <td>4</td>
                    <td>Graphics Card</td>
                    <td>&bull; 4GB Dedicated GPU</td>
                    <td>$220</td>
                </tr>
            </tbody>
        </table>

        <button onclick="changeColor()">Change Color</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
